<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>{{ title }} · Dreamnet</title>
<link rel="icon" href="/static/dreamnet/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--bg-2:#121217;--card:#1b1b22;--line:#2b2b35;--text:#f5f2f6;--muted:#9d97a8;--accent:#ff3d8b;--on-accent:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;text-decoration:none}
.brand img{width:28px;height:28px}
nav{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);font-weight:500}
nav a:hover,nav a.on{color:var(--text)}
.btn{display:inline-block;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
main{padding:44px 0 64px}
h1{font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px;text-wrap:balance}
h2{font-size:20px;margin:36px 0 8px}
h3{font-size:16px;margin:0 0 4px}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0}
.prose{max-width:70ch}
.prose p,.prose li{color:#d9d4de}
.prose li{margin:4px 0}
.meta{color:var(--muted);font-size:13px;margin:6px 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:28px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:20px}
.card p{margin:0;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:10px}
.plan.best{border-color:var(--accent)}
.price{font-size:32px;font-weight:700;letter-spacing:-.02em}
.price small{font-size:14px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;color:#d9d4de;flex:1}
.badge{align-self:flex-start;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
table{border-collapse:collapse;width:100%;max-width:620px;margin-top:10px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.note{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;color:#d9d4de;margin-top:22px;max-width:70ch}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;padding-top:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){header .wrap{height:auto;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}nav{margin-left:0;width:100%}h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><img src="/static/dreamnet/icon.svg" alt=""> Dreamnet</a>
  <nav>
    <a href="/pricing" class="{{ 'on' if page=='pricing' }}">Pricing</a>
    <a href="/trust" class="{{ 'on' if page=='trust' }}">Trust &amp; safety</a>
    <a href="/">Sign in</a>
  </nav>
</div></header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
<footer><div class="wrap">
  <span>© 2026 {{ company }} · Adults 18+ only · All characters are fictional adults</span>
  <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/content-policy">Content Policy</a><a href="/trust">Trust &amp; safety</a>
  {% if contact %}<span>Contact: {{ contact }}</span>{% endif %}
</div></footer>
</body>
</html>
